<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <h2>Slider</h2>
    <div class="slide-container">
        <div class="slides">

            <p class="number">1 / 4</p>
            <img src="./img/1.jpg" class="img">
            <p class="text">Caption Image 1</p>

        </div>

        <div class="slides">

            <p class="number">2 / 4</p>
            <img src="./img/2.jpg" class="img">
            <p class="text">Caption Image 2</p>

        </div>

        <div class="slides">

            <p class="number">3 / 4</p>
            <img src="./img/3.jpg" class="img">
            <p class="text">Caption Image 3</p>

        </div>

        <div class="slides">

            <p class="number">4 / 4</p>
            <img src="./img/4.jpg" class="img">
            <p class="text">Caption Image 4</p>

        </div>
    </div>

    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</body>

<script src="./code.js"></script>

</html>
